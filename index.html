<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypty VPN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">🔐</div>
            <h1>Crypty VPN</h1>
            <p class="tagline">Secure • Private • Free</p>
        </div>

        <div class="status-card" id="statusCard">
            <div class="status-indicator" id="statusIndicator"></div>
            <h2 id="statusText">Disconnected</h2>
            <p id="statusSubtext">Tap to secure your connection</p>
        </div>

        <button class="connect-btn" id="connectBtn">
            <span class="btn-text">CONNECT</span>
        </button>

        <div class="location-section">
            <h3>Select Server</h3>
            <select id="serverSelect" class="server-select">
                <option value="us">🇺🇸 United States</option>
                <option value="uk">🇬🇧 United Kingdom</option>
                <option value="de">🇩🇪 Germany</option>
                <option value="sg">🇸🇬 Singapore</option>
                <option value="jp">🇯🇵 Japan</option>
                <option value="nl">🇳🇱 Netherlands</option>
            </select>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <span class="label">IP Address</span>
                <span class="value" id="ipDisplay">---.---.---.---</span>
            </div>
            <div class="info-item">
                <span class="label">Location</span>
                <span class="value" id="locationDisplay">Not Connected</span>
            </div>
            <div class="info-item">
                <span class="label">Status</span>
                <span class="value" id="encryptionStatus">Inactive</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
